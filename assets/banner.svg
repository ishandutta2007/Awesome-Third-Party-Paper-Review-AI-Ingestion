<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="340" viewBox="0 0 1200 340" style="background:0 0"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="accent-purple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".7"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".2"/></linearGradient><linearGradient id="card-border" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".2"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-blur" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur stdDeviation="25"/></filter></defs><style>@keyframes float{0%{transform:translateY(0)}}@keyframes pulse{0%{opacity:.3;transform:scale(.98)}}@keyframes orb1{0%{cx:150px;cy:80px}}@keyframes orb2{0%{cx:1050px;cy:260px}}.title-text{font-weight:800;font-size:38px;letter-spacing:-.5px}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:400;font-size:16px;fill:#94a3b8;letter-spacing:.2px}.badge-text{font-weight:600;font-size:12px;letter-spacing:.5px}.float-slow{animation:float 7s ease-in-out infinite alternate}.pulse-glow{animation:pulse 4s ease-in-out infinite alternate}.stream-line{stroke-dasharray:8 12;animation:dash 20s linear infinite}.stream-line-reverse{stroke-dasharray:6 10;animation:dashReverse 15s linear infinite}.orb-move-1{animation:orb1 12s ease-in-out infinite alternate}.orb-move-2{animation:orb2 10s ease-in-out infinite alternate}</style><rect width="1196" height="336" x="2" y="2" fill="url(#bg-grad)" stroke="url(#card-border)" stroke-width="2" rx="20"/><g class="pulse-glow" style="transform-origin:center"><circle r="140" fill="url(#accent-cyan)" class="orb-move-1" filter="url(#soft-blur)"/><circle r="130" fill="url(#accent-purple)" class="orb-move-2" filter="url(#soft-blur)"/></g><g stroke="#334155" stroke-opacity=".25" stroke-width="1"><line x1="60" x2="60" y1="0" y2="340"/><line x1="180" x2="180" y1="0" y2="340"/><line x1="1020" x2="1020" y1="0" y2="340"/><line x1="1140" x2="1140" y1="0" y2="340"/><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="280" y2="280"/></g><g fill="none" stroke-width="2"><path stroke="#06b6d4" stroke-opacity=".4" d="M-20,100 C200,60 300,220 500,180" class="stream-line"/><path stroke="#a855f7" stroke-opacity=".4" d="M700,160 C900,110 1000,270 1220,230" class="stream-line-reverse"/><path stroke="#3b82f6" stroke-opacity=".3" d="M-10,240 C150,280 280,110 450,150" class="stream-line"/></g><g class="float-slow" style="transform-origin:140px 170px"><rect width="145" height="110" x="70" y="115" fill="#1e293b" fill-opacity=".75" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1.5" rx="12"/><circle cx="100" cy="145" r="10" fill="#38bdf8" fill-opacity=".2"/><path stroke="#38bdf8" stroke-linecap="round" stroke-width="2" d="M96 145 L104 145 M100 141 L100 149"/><text x="120" y="149" fill="#f8fafc" class="badge-text">Paper Intake</text><rect width="105" height="6" x="90" y="170" fill="#475569" fill-opacity=".6" rx="3"/><rect width="75