<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: transparent;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .float-slow {
      animation: float 7s ease-in-out infinite alternate;
    }
    .pulse-glow {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .stream-line {
      stroke-dasharray: 8 12;
      animation: dash 20s linear infinite;
    }
    .stream-line-reverse {
      stroke-dasharray: 6 10;
      animation: dashReverse 15s linear infinite;
    }
    .orb-move-1 {
      animation: orb1 12s ease-in-out infinite alternate;
    }
    .orb-move-2 {
      animation: orb2 10s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes dashReverse {
      to { stroke-dashoffset: 1000; }
    }
    @keyframes orb1 {
      0% { cx: 150px; cy: 80px; }
      100% { cx: 280px; cy: 140px; }
    }
    @keyframes orb2 {
      0% { cx: 1050px; cy: 260px; }
      100% { cx: 920px; cy: 190px; }
    }
  </style>

  <!-- Container Box with Rounded Corners -->
  <rect width="1196" height="336" x="2" y="2" rx="20" fill="url(#bg-grad)" stroke="url(#card-border)" stroke-width="2" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (strictly in background) -->
  <g class="pulse-glow" style="transform-origin: center;">
    <circle class="orb-move-1" r="140" fill="url(#accent-cyan)" filter="url(#soft-blur)" />
    <circle class="orb-move-2" r="130" fill="url(#accent-purple)" filter="url(#soft-blur)" />
  </g>

  <!-- Decorative Tech Grid Matrix (Background) -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="340" />
    <line x1="180" y1="0" x2="180" y2="340" />
    <line x1="1020" y1="0" x2="1020" y2="340" />
    <line x1="1140" y1="0" x2="1140" y2="340" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Flowing Dynamic Data Streams behind the sides -->
  <g fill="none" stroke-width="2">
    <path class="stream-line" d="M-20,100 C200,60 300,220 500,180" stroke="#06b6d4" stroke-opacity="0.4" />
    <path class="stream-line-reverse" d="M700,160 C900,110 1000,270 1220,230" stroke="#a855f7" stroke-opacity="0.4" />
    <path class="stream-line" d="M-10,240 C150,280 280,110 450,150" stroke="#3b82f6" stroke-opacity="0.3" />
  </g>

  <!-- Side Floating Pill/Card 1 (Left - Intake Flow) -->
  <g class="float-slow" style="transform-origin: 140px 170px;">
    <rect x="70" y="115" width="145" height="110" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="100" cy="145" r="10" fill="#38bdf8" fill-opacity="0.2" />
    <path d="M96 145 L104 145 M100 141 L100 149" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="120" y="149" fill="#f8fafc" class="badge-text">Paper Intake</text>
    <rect x="90" y="170" width="105" height="6" rx="3" fill="#475569" fill-opacity="0.6" />
    <rect x="90" y="184" width="75" height="6" rx="3" fill="#38bdf8" fill-opacity="0.6" />
    <rect x="90" y="198" width="90" height="6" rx="3" fill="#475569" fill-opacity="0.6" />
  </g>

  <!-- Side Floating Pill/Card 2 (Right - AI Redline & Playbook) -->
  <g class="float-slow" style="animation-delay: -3.5s; transform-origin: 1040px 170px;">
    <rect x="975" y="115" width="155" height="110" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="1005" cy="145" r="10" fill="#c084fc" fill-opacity="0.2" />
    <path d="M1001 145 L1004 148 L1010 142" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="1025" y="149" fill="#f8fafc" class="badge-text">AI Redlining</text>
    <rect x="995" y="170" width="115" height="6" rx="3" fill="#ef4444" fill-opacity="0.6" />
    <rect x="995" y="184" width="85" height="6" rx="3" fill="#10b981" fill-opacity="0.7" />
    <rect x="995" y="198" width="100" height="6" rx="3" fill="#c084fc" fill-opacity="0.6" />
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed never obscured) -->
  <g>
    <!-- Category Pill Badge -->
    <rect x="445" y="52" width="310" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="url(#primary-grad)" stroke-width="1.5" />
    <circle cx="462" cy="68" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="476" y="73" fill="#cbd5e1" class="badge-text">LEGAL TECH &amp; CONTRACT INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="600" y="138" text-anchor="middle" class="title-text" fill="url(#primary-grad)" filter="url(#glow)">
      Awesome Third-Party Paper Review
    </text>
    <text x="600" y="180" text-anchor="middle" class="title-text" fill="#f8fafc">
      &amp; AI Ingestion
    </text>

    <!-- Subtitle / Mission -->
    <text x="600" y="222" text-anchor="middle" class="subtitle-text">
      Curated platforms &amp; open-source architectures for counterparty paper analysis,
    </text>
    <text x="600" y="246" text-anchor="middle" class="subtitle-text">
      playbook deviation detection, automated redlining, and structured ingestion.
    </text>

    <!-- Interactive / Status Pills in Foreground -->
    <g transform="translate(385, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="65" y="17" text-anchor="middle" fill="#7dd3fc" class="badge-text">⚡ Counterparty AI</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="140" height="26" rx="13" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="215" y="17" text-anchor="middle" fill="#a5b4fc" class="badge-text">⚖️ Playbook Redline</text>

      <!-- Pill 3 -->
      <rect x="300" y="0" width="130" height="26" rx="13" fill="#0f172a" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
      <text x="365" y="17" text-anchor="middle" fill="#e9d5ff" class="badge-text">🚀 Open-Source RAG</text>
    </g>
  </g>
</svg>
